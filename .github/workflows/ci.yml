name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Android APK կառուցել (EAS)'
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Expo փաթեթների համատեղելիություն
        run: npx expo install --check
      - name: TypeScript ստուգում
        run: npx tsc --noEmit

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Կապել Expo նախագծին
        run: eas init --non-interactive --force
      - name: Կառուցել APK (հղումը կհայտնվի ամփոփման մեջ և expo.dev-ում)
        run: eas build --platform android --profile preview --non-interactive --no-wait
